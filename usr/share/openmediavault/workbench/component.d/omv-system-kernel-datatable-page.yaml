version: "1.0"
type: component
data:
  name: omv-system-kernel-datatable-page
  type: datatablePage
  config:
    autoReload: false
    hasSearchField: true
    stateId: b0079164-4add-11ec-a977-ebf62ed2368a
    rowId: name
    store:
      proxy:
        service: Kernel
        get:
          method: getKernelList
    columns:
      - name: _("Name")
        prop: name
        flexGrow: 3
        sortable: true
      - name: _("Kernel")
        prop: key
        flexGrow: 1
        sortable: true
        hidden: true
      - name: _("Family")
        prop: family
        flexGrow: 1
        sortable: true
      - name: _("Entry ID")
        prop: entry_id
        flexGrow: 2
        sortable: true
        hidden: true
      - name: _("Default")
        prop: default
        flexGrow: 1
        sortable: true
        cellTemplateName: checkIcon
      - name: _("Default reason")
        prop: reason
        flexGrow: 2
        sortable: true
      - name: _("Boot once")
        prop: nextk
        flexGrow: 1
        sortable: true
        cellTemplateName: checkIcon
      - name: _("Removeable")
        prop: remove
        flexGrow: 1
        sortable: true
        cellTemplateName: checkIcon
    actions:
      - type: menu
        icon: mdi:power
        tooltip: _("Boot")
        actions:
          - text: _("Set boot")
            icon: mdi:update
            enabledConstraints:
              minSelected: 1
              maxSelected: 1
            execute:
              type: request
              request:
                service: Kernel
                method: setKernel
                params:
                  key: "{{ _selected[0].name }}"
                  boot_once: false
                task: false
          - text: _("Set boot family")
            icon: mdi:family-tree
            execute:
              type: formDialog
              formDialog:
                title: _("Set boot family")
                fields:
                  - type: select
                    name: family
                    label: _("Family")
                    placeholder: _("Select a family ...")
                    valueField: id
                    textField: name
                    hint: _("Boots the newest installed kernel of the selected family, including after kernel updates. A specific version falls back to the newest kernel of the same distribution when none of that version are installed. Replaces any kernel set with 'Set boot'.")
                    store:
                      proxy:
                        service: Kernel
                        get:
                          method: getFamilyList
                    validators:
                      required: true
                buttons:
                  submit:
                    text: _("Set")
                    execute:
                      type: taskDialog
                      taskDialog:
                        config:
                          title: _("Setting boot family ...")
                          startOnInit: true
                          request:
                            service: Kernel
                            method: setFamily
                            params:
                              family: "{{ family }}"
                          buttons:
                            stop:
                              hidden: true
          - text: _("Boot once")
            icon: mdi:numeric-1-circle-outline
            enabledConstraints:
              minSelected: 1
              maxSelected: 1
            execute:
              type: request
              request:
                service: Kernel
                method: setKernel
                params:
                  key: "{{ _selected[0].name }}"
                  boot_once: true
                task: false
          - text: _("Unset default kernel")
            icon: mdi:restore
            execute:
              type: request
              request:
                service: Kernel
                method: unsetKernel
                task: false
          - text: _("Update GRUB")
            icon: mdi:refresh
            execute:
              type: taskDialog
              taskDialog:
                config:
                  title: _("Updating GRUB ...")
                  startOnInit: true
                  request:
                    service: Kernel
                    method: doUpdateGrub
                  buttons:
                    stop:
                      hidden: true
      - type: iconButton
        tooltip: _("Delete kernel")
        icon: mdi:delete
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: truthy
              arg0:
                prop: remove
        execute:
          type: taskDialog
          taskDialog:
            config:
              title: _("Delete kernel ...")
              startOnInit: false
              request:
                service: kernel
                method: deleteKernel
                params:
                  name: "{{ _selected[0].name }}"
                  key: "{{ _selected[0].key }}"
              buttons:
                stop:
                  hidden: true
      - type: menu
        icon: mdi:archive-arrow-down-outline
        tooltip: _("Proxmox")
        actions:
          - text: _("Install Proxmox kernel")
            icon: mdi:plus-circle-outline
            execute:
              type: formDialog
              formDialog:
                title: _("Install Proxmox Kernel")
                fields:
                  - type: select
                    name: version
                    label: _("Kernel Version")
                    value: ""
                    store:
                      data:
                        - ["6.14", "6.14"]
                        - ["6.17", "6.17"]
                        - ["7.0", "7.0"]
                    validators:
                      required: true
                buttons:
                  submit:
                    text: _("Install")
                    execute:
                      type: taskDialog
                      taskDialog:
                        config:
                          title: _("Installing Proxmox kernel ...")
                          startOnInit: true
                          request:
                            service: Kernel
                            method: doProxmox
                            params:
                              command: "install"
                              version: "{{ version }}"
                          buttons:
                            stop:
                              hidden: true
          - text: _("Remove non-Proxmox kernels")
            icon: mdi:close-circle-outline
            execute:
              type: taskDialog
              taskDialog:
                config:
                  title: _("Removing non-Proxmox kernels and headers  ...")
                  startOnInit: true
                  request:
                    service: Kernel
                    method: doProxmox
                    params:
                      command: "remove"
                  buttons:
                    stop:
                      hidden: true
      - type: menu
        icon: mdi:debian
        tooltip: _("Debian")
        actions:
          - text: _("Install Debian kernel")
            icon: mdi:plus-circle-outline
            execute:
              type: taskDialog
              taskDialog:
                config:
                  title: _("Installing Debian kernel ...")
                  startOnInit: true
                  request:
                    service: Kernel
                    method: doDebian
                    params:
                      package: "linux-image-amd64"
                  buttons:
                    stop:
                      hidden: true
          - text: _("Install Debian kernel headers")
            icon: mdi:plus-circle-outline
            execute:
              type: taskDialog
              taskDialog:
                config:
                  title: _("Installing Debian kernel headers ...")
                  startOnInit: true
                  request:
                    service: Kernel
                    method: doDebian
                    params:
                      package: "linux-headers-amd64"
                  buttons:
                    stop:
                      hidden: true
      - type: menu
        icon: mdi:toolbox-outline
        tooltip: _("Tools")
        actions:
          - text: _("Install tool")
            icon: mdi:plus-circle-outline
            execute:
              type: formDialog
              formDialog:
                title: _("Install tool")
                fields:
                  - type: select
                    name: tool
                    label: _("Tool")
                    placeholder: _("Select a tool ...")
                    valueField: id
                    textField: name
                    hint: _("Tools are added to the GRUB boot menu. Installing an installed tool reinstalls or updates it.")
                    store:
                      proxy:
                        service: Kernel
                        get:
                          method: getToolInstallList
                    validators:
                      required: true
                buttons:
                  submit:
                    text: _("Install")
                    execute:
                      type: taskDialog
                      taskDialog:
                        config:
                          title: _("Installing tool ...")
                          startOnInit: true
                          request:
                            service: Kernel
                            method: doCommand
                            params:
                              action: "install"
                              distro: "{{ tool }}"
                          buttons:
                            stop:
                              hidden: true
          - text: _("Remove tool")
            icon: mdi:delete-forever-outline
            execute:
              type: formDialog
              formDialog:
                title: _("Remove tool")
                fields:
                  - type: select
                    name: tool
                    label: _("Tool")
                    placeholder: _("Select a tool ...")
                    valueField: id
                    textField: name
                    hint: _("Only installed tools are listed.")
                    store:
                      proxy:
                        service: Kernel
                        get:
                          method: getToolRemoveList
                    validators:
                      required: true
                buttons:
                  submit:
                    text: _("Remove")
                    confirmationDialogConfig:
                      template: confirmation-danger
                      message: _("Are you sure you want to remove?")
                    execute:
                      type: taskDialog
                      taskDialog:
                        config:
                          title: _("Removing tool ...")
                          startOnInit: true
                          request:
                            service: Kernel
                            method: doCommand
                            params:
                              action: "remove"
                              distro: "{{ tool }}"
                          buttons:
                            stop:
                              hidden: true
          - text: _("Write ISO to drive")
            icon: mdi:usb-flash-drive-outline
            execute:
              type: formDialog
              formDialog:
                title: _("Write ISO to drive")
                fields:
                  - type: select
                    name: iso
                    label: _("ISO")
                    placeholder: _("Select an ISO ...")
                    valueField: path
                    textField: name
                    store:
                      proxy:
                        service: Kernel
                        get:
                          method: getIsoList
                      sorters:
                        - dir: asc
                          prop: name
                    validators:
                      required: true
                  - type: select
                    name: device
                    label: _("Device")
                    placeholder: _("Select a device ...")
                    valueField: devicefile
                    textField: description
                    hint: _("Only unused drives are listed. All data on the selected drive will be erased.")
                    store:
                      proxy:
                        service: FileSystemMgmt
                        get:
                          method: getCandidatesBg
                          task: true
                      sorters:
                        - dir: asc
                          prop: devicefile
                    validators:
                      required: true
                buttons:
                  submit:
                    text: _("Write")
                    confirmationDialogConfig:
                      template: confirmation-danger
                      message: _("This will ERASE all data on the selected drive and write the ISO to it. Are you sure you want to continue?")
                    execute:
                      type: taskDialog
                      taskDialog:
                        config:
                          title: _("Writing ISO to drive ...")
                          startOnInit: true
                          request:
                            service: Kernel
                            method: writeIso
                            params:
                              iso: "{{ iso }}"
                              device: "{{ device }}"
                          buttons:
                            stop:
                              hidden: true
      - type: menu
        icon: mdi:link
        tooltip: _("Docs")
        actions:
          - text: _("omv-extras wiki")
            icon: mdi:link-box
            execute:
              type: url
              url: '/externalRedirect/https%3A%2F%2Fwiki.omv-extras.org%2Fdoku.php%3Fid%3Domv6%3Aomv6_plugins%3Akernel%0A'
